
name: Build IPTV Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify launcher icon sources and version
        run: |
          set -euxo pipefail
          test -s app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          sha256sum app/src/main/res/mipmap-*/ic_launcher.png
          grep -q 'versionCode = 19' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Name APK with version
        run: cp app/build/outputs/apk/debug/app-debug.apk IPTVLauncher-v0.3.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTVLauncher-v0.3.4
          path: IPTVLauncher-v0.3.4.apk
          if-no-files-found: error
