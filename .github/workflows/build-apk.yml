name: Build IPTV Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify launcher icon sources and version
        run: |
          set -euxo pipefail
          test -s app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          sha256sum app/src/main/res/mipmap-*/ic_launcher.png
          grep -q 'versionCode = 30' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Verify Gradle version
        run: |
          gradle --version
          gradle --version | grep -q 'Gradle 8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Name APK with version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk "IPTVLauncher-v${VERSION}.apk"
          echo "APK_NAME=IPTVLauncher-v${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTVLauncher-${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
